# Second-node probe (challenge #230). bounties.txt tells payers to confirm on a second node and names none, because the
# keeper's sandbox can reach only rpc.nano.to. GitHub's runners can reach the others: this reads each candidate
# (read-only RPC, no key) and writes which agree with rpc.nano.to into the run summary. It opens no issue and emails
# nobody; the keeper reads the summary and names a node in the guide only from a measured AGREES.
name: second-node
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read every candidate node beside rpc.nano.to
        run: |
          set +e
          python3 ops/check-second-node.py --summary-md "$GITHUB_STEP_SUMMARY"
          code=$?
          echo "exit $code (0 another node agrees, 1 one disagrees, 3 none could be read, 4 rpc.nano.to misread the reference)" | tee -a "$GITHUB_STEP_SUMMARY"
          # A node that DISAGREES may be one bounties.txt names: the run goes red so it is seen (challenge #232).
          # 4 (the reference node misread the reference block) and any crash (2, 127, 137 ...) go red too.
          # Only 3 (none readable) stays green: the summary says UNKNOWN, and a red run every flaky day would be ignored.
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit 1; fi
